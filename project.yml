name: Songr
options:
  bundleIdPrefix: com.draegloth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SongrKit:
    path: Packages/SongrKit
targets:
  Songr:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: SongrKit
        product: SongrKit
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).PhoneSceneDelegate
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/Songr.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        # Simulator: ad-hoc sign so the CarPlay entitlement is embedded
        # (CODE_SIGNING_ALLOWED=NO strips entitlements and CarPlay hides the app).
        # Device signing set by owner later.
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
schemes:
  Songr:
    build:
      targets:
        Songr: all
