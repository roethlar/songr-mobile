<div id="songr-phone-concept">
  <style>
    #songr-phone-concept { --songr-surface:light-dark(#f6f3ec,#0e0e0d); --songr-raised:light-dark(#fffdf8,#1d1d1a); --songr-ink:light-dark(#242019,#f3eee2); --songr-muted:light-dark(#6a6050,#b6ad9c); --songr-line:light-dark(#ddd5c6,#35332d); --songr-gold:light-dark(#8f660d,#d2a744); --songr-selected:light-dark(#eedab0,#433619); color:var(--songr-ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #songr-phone-concept * { box-sizing:border-box; }
    #songr-phone-concept .songr-phone { position:relative; max-width:390px; margin-inline:auto; background:var(--songr-surface); border:1px solid var(--songr-line); border-radius:22px; overflow:hidden; }
    #songr-phone-concept button { font:inherit; color:inherit; cursor:pointer; }
    #songr-phone-concept button:focus-visible { outline:3px solid var(--songr-gold); outline-offset:2px; }
    #songr-phone-concept .songr-brandbar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px 0; }
    #songr-phone-concept .songr-wordmark { color:var(--songr-gold); font-family:Georgia,serif; font-size:21px; letter-spacing:2px; }
    #songr-phone-concept .songr-icon { width:44px; height:44px; padding:10px; border:0; background:transparent; border-radius:12px; }
    #songr-phone-concept .songr-icon svg { width:22px; height:22px; }
    #songr-phone-concept .songr-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 16px 16px; }
    #songr-phone-concept .songr-scope { display:flex; align-items:center; gap:8px; min-height:48px; padding:0; border:0; background:transparent; font-size:26px; font-weight:500; text-align:left; }
    #songr-phone-concept .songr-scope span:last-child { color:var(--songr-gold); font-size:18px; }
    #songr-phone-concept .songr-jump { min-height:48px; padding:10px 14px; border:1px solid var(--songr-line); border-radius:14px; background:var(--songr-raised); color:var(--songr-gold); white-space:nowrap; font-size:15px; font-weight:500; }
    #songr-phone-concept .songr-content { padding:0 16px 16px; min-height:345px; }
    #songr-phone-concept .songr-letter { color:var(--songr-gold); border-bottom:1px solid var(--songr-line); padding:8px 0 10px; margin:0; font-size:15px; font-weight:500; }
    #songr-phone-concept .songr-row { padding:15px 0; border-bottom:1px solid var(--songr-line); }
    #songr-phone-concept .songr-name { font-size:17px; overflow-wrap:anywhere; }
    #songr-phone-concept .songr-detail { color:var(--songr-muted); margin-top:5px; font-size:13px; }
    #songr-phone-concept .songr-albums { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; padding-top:14px; }
    #songr-phone-concept .songr-cover { aspect-ratio:1; display:grid; place-items:center; background:var(--songr-raised); color:var(--songr-gold); border-radius:10px; font-family:Georgia,serif; font-size:40px; margin-bottom:10px; }
    #songr-phone-concept .songr-player { display:flex; gap:12px; align-items:center; padding:12px 16px; border-top:1px solid var(--songr-line); background:var(--songr-raised); }
    #songr-phone-concept .songr-player-cover { width:44px; height:44px; border-radius:8px; background:var(--songr-selected); color:var(--songr-gold); display:grid; place-items:center; font-family:Georgia,serif; font-size:24px; flex-shrink:0; }
    #songr-phone-concept .songr-track { min-width:0; flex:1; }
    #songr-phone-concept .songr-track-title { font-size:14px; }
    #songr-phone-concept .songr-track-artist { font-size:12px; margin-top:4px; color:var(--songr-muted); }
    #songr-phone-concept .songr-play { width:48px; height:48px; flex-shrink:0; border:0; border-radius:50%; background:var(--songr-selected); color:var(--songr-gold); font-size:19px; }
    #songr-phone-concept .songr-overlay { position:absolute; inset:0; display:flex; align-items:flex-end; background:light-dark(#332a1955,#000a); z-index:3; padding:8px; }
    #songr-phone-concept [hidden] { display:none !important; }
    #songr-phone-concept .songr-sheet { width:100%; padding:14px; background:var(--songr-raised); border:1px solid var(--songr-line); border-radius:20px; }
    #songr-phone-concept .songr-sheet-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    #songr-phone-concept .songr-sheet-head h3 { font-size:20px; font-weight:500; margin:0; }
    #songr-phone-concept .songr-close { min-width:44px; min-height:44px; padding:8px; border:0; background:transparent; color:var(--songr-gold); }
    #songr-phone-concept .songr-alphabet { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
    #songr-phone-concept .songr-letter-key { min-height:46px; border:1px solid var(--songr-line); border-radius:10px; background:var(--songr-surface); font-size:19px; }
    #songr-phone-concept .songr-letter-key[aria-pressed="true"] { color:var(--songr-gold); background:var(--songr-selected); }
    #songr-phone-concept .songr-letter-key:disabled { opacity:.3; cursor:default; }
    #songr-phone-concept .songr-menu-option { min-height:48px; width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; border:0; border-bottom:1px solid var(--songr-line); padding:10px 8px; background:transparent; text-align:left; }
    #songr-phone-concept .songr-menu-option[aria-pressed="true"] { color:var(--songr-gold); background:var(--songr-selected); border-radius:10px; }
    #songr-phone-concept .songr-menu-option:nth-child(4) { margin-top:12px; }
  </style>
  <div class="songr-phone" aria-label="Songr phone navigation concept">
    <div class="songr-brandbar"><span class="songr-wordmark">Sǫngr</span><button class="songr-icon" data-action="settings" aria-label="Settings"><i data-lucide="settings" aria-hidden="true"></i></button></div>
    <div class="songr-nav">
      <button class="songr-scope" data-action="browse" aria-haspopup="dialog" aria-label="Choose library view"><span data-scope-title>Artists</span><span aria-hidden="true">⌄</span></button>
      <button class="songr-jump" data-action="jump" aria-haspopup="dialog">Jump A–Z</button>
    </div>
    <div class="songr-content" data-content aria-live="polite"></div>
    <div class="songr-player">
      <div class="songr-player-cover" aria-hidden="true">R</div>
      <div class="songr-track"><div class="songr-track-title">Never Going Back Again</div><div class="songr-track-artist">Fleetwood Mac</div></div>
      <button class="songr-play" data-action="play" aria-label="Play" aria-pressed="false">▶</button>
    </div>
    <div class="songr-overlay" data-overlay hidden>
      <div class="songr-sheet" role="dialog" aria-modal="true" aria-labelledby="songr-concept-sheet-title">
        <div class="songr-sheet-head"><h3 id="songr-concept-sheet-title"></h3><button class="songr-close" data-action="close">Done</button></div>
        <div data-sheet-content></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('songr-phone-concept');
      var content = root.querySelector('[data-content]');
      var overlay = root.querySelector('[data-overlay]');
      var sheet = root.querySelector('[data-sheet-content]');
      var sheetTitle = root.querySelector('#songr-concept-sheet-title');
      var scopeTitle = root.querySelector('[data-scope-title]');
      var jump = root.querySelector('[data-action="jump"]');
      var scope = 'Artists', letter = 'A', returnFocus;
      var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
      var artists = {
        A:[['A Fine Frenzy','4 albums'],['A Love Ends Suicide','1 album'],['A Perfect Circle','1 album'],['ABBA','1 album']],
        B:[['Bob Dylan','2 albums'],['Bon Iver','3 albums']], C:[['Carole King','1 album'],['Creedence Clearwater Revival','1 album']],
        D:[['David Bowie','3 albums'],['Dire Straits','1 album']], E:[['Elton John','2 albums'],['Erykah Badu','1 album']],
        F:[['Fleetwood Mac','2 albums'],['Funkadelic','1 album']], G:[['Gil Scott-Heron','1 album']], H:[['Herbie Hancock','1 album']],
        I:[['Isaac Hayes','1 album']], J:[['Joni Mitchell','3 albums']], K:[['Kate Bush','2 albums']], L:[['Led Zeppelin','2 albums']],
        M:[['Miles Davis','3 albums'],['Muse','4 albums']], N:[['Nina Simone','1 album']], O:[['Otis Redding','1 album']],
        P:[['Pink Floyd','3 albums']], Q:[['Queen','1 album']], R:[['Radiohead','3 albums']],
        S:[['Sade','2 albums'],['Stevie Wonder','3 albums']], T:[['Talk Talk','2 albums'],['Tom Waits','2 albums']],
        U:[['U2','1 album']], V:[['Van Morrison','2 albums']], W:[['Wilco','2 albums']], X:[['XTC','2 albums']],
        Y:[['Yo-Yo Ma','1 album']], Z:[['Zaz','1 album'],['Zoë Keating','3 albums'],['ZZ Ward','1 album']], '#':[['10cc','1 album'],['2Cellos','6 albums']]
      };
      var albums = {A:[['Abbey Road','The Beatles'],['Arrival','ABBA']], M:[['Maggot Brain','Funkadelic'],['Meddle','Pink Floyd']], S:[['Songs in the Key of Life','Stevie Wonder'],['Spirit of Eden','Talk Talk']]};
      var genres = {A:[['Ambient','']],B:[['Blues','']],C:[['Classical','']],E:[['Electronic','']],F:[['Folk',''],['Funk','']],H:[['Hip-Hop','']],J:[['Jazz','']],P:[['Pop',''],['Punk','']],R:[['Rock','']],S:[['Soul','']]};
      var views = ['Artists','Albums','Genres','Playlists','Recently played','Most played','Recently added'];
      function node(tag, className, text) { var el = document.createElement(tag); if (className) el.className = className; if (text !== undefined) el.textContent = text; return el; }
      function indexed() { return scope === 'Artists' || scope === 'Albums' || scope === 'Genres'; }
      function library() { return scope === 'Albums' ? albums : scope === 'Genres' ? genres : artists; }
      function render() {
        scopeTitle.textContent = scope;
        scopeTitle.parentElement.style.fontSize = scope.length > 13 ? '20px' : '26px';
        jump.hidden = !indexed();
        content.replaceChildren();
        var rows;
        if (indexed()) {
          if (!library()[letter]) letter = Object.keys(library())[0];
          rows = library()[letter];
          content.append(node('h3','songr-letter',letter));
        } else {
          rows = scope === 'Playlists' ? [['Road Trip','42 tracks'],['Quiet Morning','12 tracks'],['Gold Standard','25 tracks']] : [['Rumours','Fleetwood Mac'],['Blue','Joni Mitchell'],['Talking Book','Stevie Wonder']];
        }
        var list = node('div',scope === 'Albums' ? 'songr-albums' : 'songr-rows');
        list.setAttribute('role','list');
        rows.forEach(function(row) {
          var item = node('div',scope === 'Albums' ? 'songr-album' : 'songr-row'); item.setAttribute('role','listitem');
          if (scope === 'Albums') item.append(node('div','songr-cover',row[0][0]));
          item.append(node('div','songr-name',row[0]));
          if (row[1]) item.append(node('div','songr-detail',row[1]));
          list.append(item);
        });
        content.append(list);
      }
      function close() { overlay.hidden = true; root.querySelectorAll('.songr-brandbar,.songr-nav,.songr-content,.songr-player').forEach(function(el){ el.inert=false; }); if (returnFocus) returnFocus.focus(); }
      function open(kind, trigger) {
        returnFocus = trigger; sheet.replaceChildren();
        sheet.className = kind === 'jump' ? 'songr-alphabet' : '';
        sheetTitle.textContent = kind === 'jump' ? 'Jump to letter' : kind === 'settings' ? 'Settings' : 'Library';
        if (kind === 'jump') letters.forEach(function(value) {
          var button = node('button','songr-letter-key',value); button.type = 'button'; button.disabled = !library()[value];
          button.setAttribute('aria-pressed',String(value === letter));
          button.setAttribute('aria-label','Jump to ' + value);
          button.addEventListener('click',function(){ letter=value; render(); close(); }); sheet.append(button);
        });
        else if (kind === 'browse') views.forEach(function(value) {
          var button = node('button','songr-menu-option',value); button.type = 'button'; button.setAttribute('aria-pressed',String(value === scope));
          if (value === scope) button.append(node('span','','✓'));
          button.addEventListener('click',function(){ scope=value; letter='A'; render(); close(); }); sheet.append(button);
        });
        else { sheet.append(node('div','songr-row','Plex · Connected')); }
        root.querySelectorAll('.songr-brandbar,.songr-nav,.songr-content,.songr-player').forEach(function(el){ el.inert=true; }); overlay.hidden = false; root.querySelector('[data-action="close"]').focus();
      }
      root.querySelectorAll('[data-action]').forEach(function(button) {
        button.addEventListener('click',function(){
          var action = button.getAttribute('data-action');
          if (action === 'close') close();
          else if (action === 'play') { var playing = button.getAttribute('aria-pressed') !== 'true'; button.setAttribute('aria-pressed',String(playing)); button.setAttribute('aria-label',playing?'Pause':'Play'); button.textContent=playing?'Ⅱ':'▶'; }
          else open(action,button);
        });
      });
      overlay.addEventListener('click',function(event){ if(event.target === overlay) close(); });
      root.addEventListener('keydown',function(event){ if(event.key === 'Escape' && !overlay.hidden) close(); });
      render();
    }());
  </script>
</div>
